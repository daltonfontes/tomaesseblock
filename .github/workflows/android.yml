name: Android CI

on:
  push:
    # Tags v* são tratadas pelo release.yml.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vira o sufixo do versionName dos builds de desenvolvimento (ex.: 1.0.0-dev+27).
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: calloff-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Capturas de tela de todas as abas (tema claro e escuro), sem emulador.
      - name: Capturas de tela (Paparazzi)
        run: ./gradlew recordPaparazziDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: calloff-screenshots
          path: app/src/test/snapshots/images/*.png

      # Valida o build de release (R8 + shrink). Sem assinatura: o pacote para o Play sai do
      # workflow de lançamento (release.yml), disparado por uma tag v*.
      - name: Validar pacote de release (.aab, sem assinatura)
        run: ./gradlew bundleRelease --stacktrace
