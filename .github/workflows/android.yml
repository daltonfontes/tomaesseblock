name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tomaesseblock-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Capturas de tela de todas as abas (tema claro e escuro), sem emulador.
      - name: Capturas de tela (Paparazzi)
        run: ./gradlew recordPaparazziDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tomaesseblock-screenshots
          path: app/src/test/snapshots/images/*.png

      # Chave de upload do Play guardada nos secrets do repositório (opcional).
      # Sem os secrets, o pacote .aab é gerado sem assinatura.
      - name: Preparar chave de assinatura
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Sem chave de assinatura configurada: o .aab sairá sem assinatura."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gerar pacote para o Play (.aab)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tomaesseblock-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Remover chave de assinatura
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"
