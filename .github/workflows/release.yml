name: Release

# Lançamento de uma versão: crie e envie uma tag v<versão> (ex.: v1.0.0) que bata com o
# appVersion do gradle.properties. Gera o .aab assinado para o Play e o .apk assinado,
# e cria um Release no GitHub com os dois anexados.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  # Necessário para criar o Release no GitHub.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir tag
        run: |
          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$RELEASE_TAG' fora do formato v1.2.3"
            exit 1
          fi
          expected="v$(grep '^appVersion=' gradle.properties | cut -d= -f2)"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::A tag $RELEASE_TAG não bate com appVersion do gradle.properties ($expected)"
            exit 1
          fi

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Preparar chave de assinatura
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Cadastre os secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS e RELEASE_KEY_PASSWORD (veja o README)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gerar .aab e .apk assinados
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Remover chave de assinatura
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Renomear arquivos com a versão
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/tomaesseblock-$RELEASE_TAG.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/tomaesseblock-$RELEASE_TAG.apk"
          # Nome fixo: o link .../releases/latest/download/tomaesseblock.apk (README e site)
          # sempre aponta para a versão mais nova.
          cp app/build/outputs/apk/release/app-release.apk dist/tomaesseblock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tomaesseblock-${{ github.ref_name }}
          path: dist/*

      # A tag pode vir de um "git push" (Release ainda não existe) ou de um Release criado
      # pelo site do GitHub (que cria a tag junto). No segundo caso, só anexa os arquivos.
      - name: Publicar arquivos no Release do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "Toma Esse Block $RELEASE_TAG" \
              --generate-notes
          fi
